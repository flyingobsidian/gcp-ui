<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gcpui-api-port" content="{{.APIPort}}">
  <meta name="gcpui-cookie" content="{{.CookieName}}">
  <title>gcp-ui</title>
  <link rel="icon" href="data:,">
{{- if .Built}}
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
{{- end}}
</head>
<body>

  <div id="app"></div>
{{- else}}

{{- end}}
</body>
</html>
